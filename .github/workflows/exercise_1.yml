name: Exercise 1

on:
  push:

jobs:
  cowsay-hey-there:
    runs-on: ubuntu-latest
    steps:
    - name: install cowsay
      run: pip install cowsay
    - name: say things
      run: cowsay -c cheese -t 'hey there'
  cowpy-hi-there:
    runs-on: ubuntu-latest
    steps:
    - name: install cowpy
      run: pip install cowpy
    - name: say things
      run: cowpy -c tux hi there

